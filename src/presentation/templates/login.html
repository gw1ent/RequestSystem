<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Вход — Система учёта заявок</title>

<link href="../static/css/login.css" rel="stylesheet"/></head>
<body>
<div class="card">
<div class="logo-area">
<div class="logo-icon">
<svg fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
<h1>Система учёта заявок</h1>
<p class="subtitle">Войдите в систему для продолжения работы</p>
</div>
<form id="loginForm">
<div class="alert alert-danger" id="alertBox" style="display:none">
<svg fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span id="alertText"></span>
</div>
<div class="form-group">
<label class="form-label" for="login">Логин</label>
<div class="input-wrap">
<svg class="icon" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<input autocomplete="username" class="form-input" id="login" placeholder="Введите логин" type="text"/>
</div>
<div class="error-msg" id="loginError" style="display:none">
<svg fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span>Поле «Логин» обязательно для заполнения</span>
</div>
</div>
<div class="form-group">
<label class="form-label" for="password">Пароль</label>
<div class="input-wrap">
<svg class="icon" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<input autocomplete="current-password" class="form-input" id="password" placeholder="Введите пароль" type="password"/>
</div>
<div class="error-msg" id="passwordError" style="display:none">
<svg fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span>Поле «Пароль» обязательно для заполнения</span>
</div>
</div>
<button class="btn-primary" id="submitBtn" type="submit">Войти в систему</button>
</form>
<div class="divider">
<details>
<summary>
<svg class="arrow" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
          Демо-доступы
        </summary>
<div class="creds-grid">
<div class="cred-item"><strong>Админ:</strong><br/>admin / admin123</div>
<div class="cred-item"><strong>Оператор:</strong><br/>operator1 / oper123</div>
<div class="cred-item"><strong>Исполнитель:</strong><br/>executor1 / exec123</div>
<div class="cred-item"><strong>Заявитель:</strong><br/>applicant1 / app123</div>
</div>
</details>
</div>
</div>
<script src="../static/js/login.js"></script>
</body>
</html>
